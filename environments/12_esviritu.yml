name: esviritu_env
# Tutorial: Part 17 (viral sequence detection with EsViritu v2.0.2)
# Activate: micromamba activate esviritu_env
# Example input: paired-end RNA-seq FASTQ (.fastq.gz)
# Database (download once):
#   esviritu download_db -o ~/esviritu_db
#   Source: Zenodo record 7876309 (EsViritu DB v2.0.2)
#
# UA HPC NOTE: esviritu was removed from bioconda; installing via pip instead.
# biopython is kept in conda-forge (no htslib chain).
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - pip
  - biopython>=1.80
  - pip:
      - esviritu
