name: circrna_env
# Tutorial: Part 13 (circular RNA-seq analysis with CIRCexplorer2)
# CIRCexplorer2 uses STAR chimeric alignments to detect back-splice junctions.
# Activate: conda activate circrna_env
# Example input: paired-end FASTQ (gzip), hg38 STAR index, RefSeq/KnownGenes annotation
# Output: circularRNA_known.txt
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - circexplorer2=2.3.8
  - star=2.7.11b             # Required for back-splice chimeric alignment mode
  - trim-galore=0.6.10
  - samtools=1.21
  - hisat2=2.2.1             # Optional alternative aligner
  - bowtie=1.3.1             # Optional alternative aligner
  - sra-tools=3.1.1
  - pigz=2.8
