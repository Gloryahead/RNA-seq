name: suppa2_env
# Tutorial: Part 11 (transcript-level alternative splicing with SUPPA2)
# SUPPA2 has no bioconda package; install from GitHub after env creation.
# Activate: conda activate suppa2_env
# Post-activation setup:
#   git clone https://github.com/comprna/SUPPA.git
#   cd SUPPA && pip install -e .
# Example input: Salmon quant.sf files, GENCODE vM25 GTF (GRCm38)
# Reference annotation: gencode.vM25.annotation.gtf
channels:
  - bioconda
  - conda-forge
  - nodefaults
dependencies:
  - python=3.8              # SUPPA2 is tested on Python 3.8
  - numpy=1.24.4
  - scipy=1.10.1
  - pandas=1.5.3
  - scikit-learn=1.3.2
  - r-base=4.4.1            # For optional downstream R analysis
  - samtools=1.21
