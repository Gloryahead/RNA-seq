name: cancer_subtype_env
# Tutorial: Part 6 (cancer subtype prediction — PAM50 for breast cancer)
# CRAN packages only via conda; Bioconductor installed via:
#   conda activate cancer_subtype_env
#   Rscript environments/r_scripts/install_cancer_subtype_r.R
channels:
  - conda-forge
  - nodefaults
dependencies:
  - r-base
  - r-pheatmap
  - r-data.table
  - r-devtools
  - r-biocmanager
  - r-caret
  - r-xtable
