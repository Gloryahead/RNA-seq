name: mirna_env
# Tutorials: Part 15 (miRNA-seq with miRDeep2), Part 15.2 (UMI-based miRNA-seq)
# miRDeep2 requires Bowtie v1 (not Bowtie2) for its internal alignment steps.
# Activate: micromamba activate mirna_env
# Example input (Part 15): GSE64977, SRR1759248, adapter TGGAATTCTCGGGTGCCAAGG,
#   read length 18-30 nt, Ensembl GRCh38 genome (release 113), miRBase mature.fa + hairpin.fa
# Reference databases (download manually):
#   miRBase: ftp://mirbase.org/pub/mirbase/CURRENT/
#   Ensembl: ftp://ftp.ensembl.org/pub/release-113/
# QIAseq miRNA Kit used in Part 15.2 (UMI handling with umi_tools)
#
# UA HPC NOTE — excluded from conda due to native-lib or channel conflicts:
#   mirdeep2: bioconda package lists umi_tools+cutadapt as conda runtime deps that
#     conflict (pysam→libdeflate chain). Install manually after env is built:
#       micromamba activate mirna_env
#       git clone https://github.com/rajewsky-lab/mirdeep2.git
#       cd mirdeep2 && perl install.pl
#   umi_tools: conda pysam→htslib→c-ares blocked; pip section unreliable in
#     micromamba 2.x. Install manually after env is built:
#       micromamba activate mirna_env && pip install umi_tools
#   sra-tools: libcurl→libnghttp2→c-ares chain blocked on UA HPC; use rnaseq_env
#   fastqc: bioconda package requires openjdk→lcms2 conflict; use rnaseq_env
#   samtools: use rnaseq_env for BAM operations
channels:
  - bioconda
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - pip
  # ── miRNA detection infrastructure ───────────────────────────────────────────
  - bowtie>=1.3                # miRDeep2 requires Bowtie v1, not Bowtie2
  - perl>=5.32                 # miRDeep2 pipeline is Perl-based
  # ── Adapter trimming ──────────────────────────────────────────────────────────
  - cutadapt>=4
  - trim-galore>=0.6
