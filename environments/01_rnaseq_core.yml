name: rnaseq_env
# Tutorials: Parts 1, 2, 10 (isoform), 14 (small RNA), 18 (viral expression)
# Core alignment, QC, and preprocessing environment for bulk RNA-seq.
# Activate: conda activate rnaseq_env
# Example input: paired-end FASTQ, mm10/hg38 STAR index (refgenie), GENCODE M25 GTF
# Example datasets: GSE259357 (mm10, Part 2); SRR28119110 (Parts 9/10)
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  # ── Quality control ──────────────────────────────────────────────────────────
  - fastqc=0.12.1
  - multiqc=1.25.1
  - fastq-screen=0.15.3
  # ── Adapter trimming ─────────────────────────────────────────────────────────
  - trim-galore=0.6.10
  - cutadapt=4.9
  # ── Aligners ─────────────────────────────────────────────────────────────────
  # Tutorial Part 1 specified STAR=2.7.1a; 2.7.11b is current stable.
  # Pin to 2.7.1a if strict tutorial reproduction is required.
  - star=2.7.11b
  - bowtie2=2.5.4
  - bowtie=1.3.1             # Required for small RNA-seq (Part 14)
  # ── Post-alignment ───────────────────────────────────────────────────────────
  - samtools=1.21
  - subread=2.0.6            # Provides featureCounts
  # ── Transcript quantification ────────────────────────────────────────────────
  - salmon=1.10.3
  # ── Data download ────────────────────────────────────────────────────────────
  - sra-tools=3.1.1
  - pigz=2.8
