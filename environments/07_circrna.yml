name: circrna_env
# Tutorial: Part 13 (circular RNA-seq analysis with CIRCexplorer2)
# CIRCexplorer2 uses STAR chimeric alignments to detect back-splice junctions.
# Activate: conda activate circrna_env
# Example input: paired-end FASTQ (gzip), hg38 STAR index, RefSeq/KnownGenes annotation
# Output: circularRNA_known.txt
#
# NOTE: circexplorer2 installed via pip — its PyPI pysam wheel bundles its own
#   libhtslib, bypassing the UA HPC conda-forge c-ares constraint.
# samtools excluded — use rnaseq_env for BAM conversion steps.
channels:
  - bioconda
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - pip
  - star>=2.7
  - trim-galore>=0.6
  - hisat2>=2.2
  - bowtie>=1.3
  - sra-tools>=3.0
  - pigz
  - pip:
      - circexplorer2
