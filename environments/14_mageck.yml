name: mageck_env
# Tutorial: CRISPR screen analysis (fastq → sgRNA counts → gene scores → pathways)
# Activate: micromamba activate mageck_env
# Example input: single-end FASTQ, sgRNA library brunello.tsv
#   Library:   https://zenodo.org/records/5750854/files/brunello.tsv
#   Demo data: http://cistrome.org/MAGeCKFlute/demo.tar.gz
# Bioconductor (clusterProfiler, pathview, etc.) installed via:
#   Rscript environments/r_scripts/install_mageck_r.R
# NOTE: mageck from bioconda (pure-Python CRISPR screen tool; no htslib runtime dep).
#   seqtk excluded — chains through htslib on UA HPC; use rnaseq_env instead.
#   micromamba 2.x pip sections are unreliable — install via conda only.
channels:
  - bioconda
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  # ── CRISPR screen analysis ─────────────────────────────────────────────────
  - mageck                     # bioconda; pure-Python; no htslib dep
  # ── R for pathway analysis ────────────────────────────────────────────────────
  - r-base
  - r-ggplot2
  - r-ggrepel
  - r-dplyr
  - r-reshape2
  - r-rcolorbrewer
  - r-pheatmap
  - r-venndiagram
  - r-biocmanager
