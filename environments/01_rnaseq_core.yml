name: rnaseq_env
# Tutorials: Parts 1, 2, 10 (isoform), 14 (small RNA), 18 (viral expression)
# Core alignment, QC, and preprocessing environment for bulk RNA-seq.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.9
  # ── Quality control ──────────────────────────────────────────────────────────
  - fastqc>=0.12
  - multiqc>=1.25
  - fastq-screen
  # ── Adapter trimming ─────────────────────────────────────────────────────────
  - trim-galore>=0.6
  - cutadapt>=4
  # ── Aligners ─────────────────────────────────────────────────────────────────
  - star>=2.7
  - bowtie2>=2.5
  - bowtie>=1.3
  # ── Post-alignment ───────────────────────────────────────────────────────────
  - samtools>=1.18
  - subread>=2.0
  # ── Transcript quantification ────────────────────────────────────────────────
  - salmon>=1.10
  - gffread>=0.12
  # ── Data download ────────────────────────────────────────────────────────────
  - sra-tools>=3.0
  - pigz
