name: circrna_env
# Tutorial: Part 13 (circular RNA-seq analysis with CIRCexplorer2)
# CIRCexplorer2 uses STAR chimeric alignments to detect back-splice junctions.
# Activate: conda activate circrna_env
# Example input: paired-end FASTQ (gzip), hg38 STAR index, RefSeq/KnownGenes annotation
# Output: circularRNA_known.txt
channels:
  - bioconda
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - circexplorer2>=2.3
  - star>=2.7
  - trim-galore>=0.6
  - samtools>=1.18
  - hisat2>=2.2
  - bowtie>=1.3
  - sra-tools>=3.0
  - pigz
