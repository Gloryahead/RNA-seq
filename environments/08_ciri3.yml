name: ciri3_env
# Tutorial: Part 13.2 (CIRI3 v1.8.0 — advanced circRNA detection and DE)
# CIRI3 distributes its own environment.yaml; this file mirrors and pins it.
# Download CIRI3 jar from: https://github.com/bioinfo-biols/CIRI-cookbook/releases
# Activate: micromamba activate ciri3_env
# Example input: paired-end FASTQ (gzip), GRCh38 primary assembly FASTA, GRCh38.110 GTF
# SRA accessions: SRR5398213-SRR5398218 (GSE97239, gastric cancer exosomal circRNAs)
# Bioconductor (edgeR, limma) installed via:
#   Rscript environments/r_scripts/install_ciri3_r.R
#
# UA HPC NOTE — the following are excluded from conda due to native-lib conflicts:
#   bwa, openjdk, sra-tools, samtools, subread/featureCounts
# Use system modules or rnaseq_env for those steps:
#   module load bwa
#   module load java  (or: module load openjdk)
#   module load samtools   (or activate rnaseq_env)
#   featureCounts: activate rnaseq_env (subread is already installed there)
#   SRA downloads: activate rnaseq_env (sra-tools is already installed there)
channels:
  - bioconda
  - conda-forge
  - nodefaults
dependencies:
  - star>=2.7                # Gene expression quantification
  - python=3.9
  # Downstream R analysis (edgeR/limma): use rnaseq_r_env
