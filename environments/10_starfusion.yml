name: fusiongene_env
# Fusion gene detection with Arriba
# Replaces STAR-Fusion (bioconda linux-64 officially unsupported since 2019).
# Arriba v2.5+ is a C++ tool, actively maintained (Aug 2025), linux-64 native,
# and is among the highest-sensitivity fusion callers in benchmark studies.
# Activate: micromamba activate fusiongene_env
#
# Workflow (Arriba requires STAR run with specific flags):
#   # Step 1 — align with Arriba-specific STAR flags:
#   micromamba run -n fusiongene_env STAR \
#       --runMode alignReads \
#       --outSAMtype BAM SortedByCoordinate \
#       --outSAMstrandField intronMotif \
#       --outFilterIntronMotifs RemoveNoncanonical \
#       --chimSegmentMin 10 \
#       --chimOutType WithinBAM SoftClip \
#       --chimJunctionOverhangMin 10 \
#       --chimScoreMin 1 \
#       ...
#   # Step 2 — call fusions:
#   micromamba run -n fusiongene_env arriba \
#       -x Aligned.sortedByCoord.out.bam \
#       -a genome.fa -g annotation.gtf \
#       -o fusions.tsv -O fusions.discarded.tsv
#
# Reference files (download once, ~2 GB for GRCh38):
#   download_references.sh GRCh38  # script bundled with arriba
# Example input: paired-end FASTQ, SRR30961741 (rhabdomyosarcoma, PAX3-FOXO1)
#
# UA HPC NOTE: sra-tools excluded — use rnaseq_env for SRA downloads.
channels:
  - bioconda
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - arriba>=2.5              # C++ binary; bundles htslib statically; no c-ares dep
  - star>=2.7                # alignment (Arriba requires specific STAR flags above)
  - trim-galore>=0.6         # adapter trimming
  - pigz                     # parallel gzip for FASTQ
