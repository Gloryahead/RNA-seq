name: wgcna_env
# Tutorial: WGCNA gene co-expression network analysis
# CRAN packages only via conda; Bioconductor installed via:
#   conda activate wgcna_env
#   Rscript environments/r_scripts/install_wgcna_r.R
# Example input: normalized_counts.tsv, sample_info.tsv, gene_data.tsv
# GEO dataset: GSE261875 (32 samples, 8 conditions, human TDP-43 study)
# External database: STRING v11.5 (species 9606 for Homo sapiens)
# Enable multi-threading (call in R before WGCNA):
#   WGCNA::enableWGCNAThreads(nThreads = 8)
channels:
  - conda-forge
  - nodefaults
dependencies:
  - r-base
  - r-wgcna
  - r-igraph
  - r-reshape2
  - r-rcolorbrewer
  - r-corrplot
  - r-ggplot2
  - r-ggrepel
  - r-pheatmap
  - r-dplyr
  - r-biocmanager
