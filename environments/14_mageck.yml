name: mageck_env
# Tutorial: CRISPR screen analysis (fastq → sgRNA counts → gene scores → pathways)
# Activate: micromamba activate mageck_env
# Example input: single-end FASTQ, sgRNA library brunello.tsv
#   Library:   https://zenodo.org/records/5750854/files/brunello.tsv
#   Demo data: http://cistrome.org/MAGeCKFlute/demo.tar.gz
# Bioconductor (clusterProfiler, pathview, etc.) installed via:
#   Rscript environments/r_scripts/install_mageck_r.R
# NOTE: mageck installed via pip — its conda-forge package chains through htslib
#   (c-ares constraint on UA HPC); the PyPI wheel is pure Python and has no
#   native htslib dependency. seqtk also excluded for the same reason.
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - pip
  # ── R for pathway analysis ────────────────────────────────────────────────────
  - r-base
  - r-ggplot2
  - r-ggrepel
  - r-dplyr
  - r-reshape2
  - r-rcolorbrewer
  - r-pheatmap
  - r-venndiagram
  - r-biocmanager
  - pip:
      - mageck
