name: reditools2_env
# Tutorial: Part 9 (RNA editing analysis with REDItools2)
# WARNING: REDItools2 requires Python 2.7 (end-of-life).
#   Alternative modern tools: GIREMI, SPRINT — consider those for new projects.
# Activate: conda activate reditools2_env
# Post-activation setup:
#   git clone https://github.com/tflati/reditools2.0.git
#   cd reditools2.0 && pip install -r requirements.txt
# Example input: BAM (RNA-seq, STAR-aligned), Mouse GRCm38 FASTA
# SRA accession: SRR28119110
#
# NOTE: openmpi/mpi4py are NOT in this conda env — they chain through an old
# c-ares that conflicts with samtools/htslib. Load the HPC system MPI instead:
#   module load openmpi  (before running REDItools2 parallel mode)
# For single-threaded use, no MPI is needed.
channels:
  - bioconda
  - conda-forge
  - nodefaults
dependencies:
  - python=2.7
  # ── Build dependencies required by REDItools2 ─────────────────────────────────
  - libffi
  - libxml2
  - libxslt
  - zlib
  - bzip2
  - xz               # provides lzma — 'lzma' is not a conda package
  - ncurses
  # ── Genomics tools ────────────────────────────────────────────────────────────
  - htslib>=1.18
  - samtools>=1.18
  - tabix
  - bedtools>=2.30
  - gffread>=0.12
  # ── Downstream R analysis — run in rnaseq_r_env, not here ───────────────────
  # R packages used: data.table, limma, edgeR (already in rnaseq_r_env)
