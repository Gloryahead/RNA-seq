name: ciri3_env
# Tutorial: Part 13.2 (CIRI3 v1.8.0 — advanced circRNA detection and DE)
# CIRI3 distributes its own environment.yaml; this file mirrors and pins it.
# Download CIRI3 jar from: https://github.com/bioinfo-biols/CIRI-cookbook/releases
# Activate: conda activate ciri3_env
# Example input: paired-end FASTQ (gzip), GRCh38 primary assembly FASTA, GRCh38.110 GTF
# SRA accessions: SRR5398213-SRR5398218 (GSE97239, gastric cancer exosomal circRNAs)
# Bioconductor (edgeR, limma) installed via:
#   Rscript environments/r_scripts/install_ciri3_r.R
#
# NOTE: samtools and subread/featureCounts excluded — both require htslib which
#   is not installable via conda on UA HPC due to a c-ares version constraint.
#   For BAM conversion and gene-count steps, activate rnaseq_env and run
#   samtools/featureCounts from there.
channels:
  - bioconda
  - conda-forge
  - nodefaults
dependencies:
  - openjdk>=17              # CIRI3 runtime requirement
  - bwa>=0.7.17              # Read alignment for CIRI3
  - star>=2.7                # Gene expression quantification side
  - sra-tools>=3.0
  - python=3.9
  # Downstream R analysis (edgeR/limma): use rnaseq_r_env
