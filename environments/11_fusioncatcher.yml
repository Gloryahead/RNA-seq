name: fusioncatcher_env
# Tutorial: Part 16.2 (fusion gene detection with FusionCatcher)
# FusionCatcher installs STAR, BOWTIE, BLAT internally as dependencies.
# Tutorial recommendation: micromamba create -p ~/Env_FusionCatcher -y fusioncatcher
# Activate: micromamba activate fusioncatcher_env
# Example input: paired-end FASTQ, SRR30961741 (rhabdomyosarcoma, PAX3-FOXO1 fusion)
# Requirements: ≥20-30M read pairs, read length ≥75bp, fragment size >300bp
# Database builds (run once, ~15 GB each):
#   fusioncatcher-build -g homo_sapiens    -o ~/fusioncatcher_Index_human
#   fusioncatcher-build -g mus_musculus    -o ~/fusioncatcher_Index_mouse
#   fusioncatcher-build -g rattus_norvegicus -o ~/fusioncatcher_Index_rat
#
# UA HPC NOTE:
#   bioconda fusioncatcher requires openpyxl=2.5.0a2 (2016 alpha, gone from all
#   channels). fusioncatcher is NOT on PyPI (micromamba 2.x pip sections fail
#   for packages that don't exist there). This env is a stub with runtime deps.
#   Install fusioncatcher manually after env is built:
#     micromamba activate fusioncatcher_env
#     pip install git+https://github.com/ndaniel/fusioncatcher.git
#   OR use the Apptainer/Singularity image (recommended for complex pipelines):
#     apptainer pull docker://ndaniel/fusioncatcher
#   External tools (STAR, BOWTIE, BLAT, samtools): use rnaseq_env or module load.
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - pip
  - biopython>=1.80            # FusionCatcher runtime dep (no htslib chain)
  - numpy>=1.24
  - scipy>=1.10
