name: spladder_env
# Tutorial: Part 8 (alternative splicing analysis with SplAdder)
# SplAdder is pip-installable; BAM inputs come from rnaseq_env alignment.
# Activate: conda activate spladder_env
# Example input: BAM files (STAR-aligned), GENCODE vM25 GTF
# SRA accessions: SRR28119110-SRR28119113
channels:
  - bioconda
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - pip
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=1.5
  - matplotlib>=3.7
  - h5py>=3.7
  - pysam>=0.20
  - pip:
      - spladder
