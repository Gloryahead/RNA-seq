name: rnaseq_r_env
# Core R environment — CRAN packages only via conda.
# Bioconductor packages are installed post-activation via:
#   Rscript environments/r_scripts/install_bioconductor.R
channels:
  - conda-forge
  - nodefaults
dependencies:
  - r-base
  - r-ggplot2
  - r-ggrepel
  - r-ggfortify
  - r-pheatmap
  - r-venndiagram
  - r-corrplot
  - r-data.table
  - r-readxl
  - r-stringr
  - r-tidyverse
  - r-dplyr
  - r-optparse
  - r-devtools
