name: rnaediting_env
# RNA editing analysis with JACUSA2
# Replaces REDItools2 (Python 2.7 EOL, no linux-64 conda support).
# JACUSA2 v2.1+ is Java-based, actively maintained (Jun 2026), and detects
# A-to-I (and other) editing events from RNA-seq BAM files.
# Activate: micromamba activate rnaediting_env
#
# Basic workflow:
#   # Step 1 — align (use rnaseq_env):
#   micromamba run -n rnaseq_env STAR --runMode alignReads ...
#   micromamba run -n rnaseq_env samtools sort -o sorted.bam Aligned.out.bam
#   micromamba run -n rnaseq_env samtools index sorted.bam
#   # Step 2 — call editing sites:
#   micromamba run -n rnaediting_env JACUSA2 call-1 \
#       -r editing_sites.tsv sorted.bam
#
# Example input: RNA-seq BAM (STAR-aligned), reference FASTA, dbSNP VCF
# SRA accession: SRR28119110
#
# UA HPC NOTE: samtools excluded — htslib chain blocked; use rnaseq_env for
#   BAM sorting/indexing. JACUSA2 reads BAM directly via its own Java library.
  # UA HPC NOTE: R packages excluded — bioconda's old r-dplyr/r-ggplot2 builds
  # require r-base =3.3.1 (no longer in conda-forge), poisoning the solver.
  # Use rnaseq_r_env for all downstream R analysis (r-ggplot2, r-dplyr, etc.
  # are already installed there).
channels:
  - bioconda
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - jacusa2>=2.1             # Java-based; no htslib/c-ares conda dep
