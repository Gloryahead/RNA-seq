name: rnaseq_r_env
# Tutorials: Parts 3, 4, 5, 10 (downstream), 19, 20
# Core R/Bioconductor environment for DEG analysis, publication figures,
# pathway enrichment (KEGG, GO, GSEA), isoform import, and normalization.
# Activate: conda activate rnaseq_r_env
# Example input: counts_raw.tsv, DEG_P1_lfc0.tsv, dge_v.rds, quant.sf (Salmon)
# MSigDB gene sets (Part 5): https://www.gsea-msigdb.org/gsea/msigdb
# After activation run: Rscript r_scripts/install_core_r_extras.R
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - r-base=4.4.1
  # ── Differential expression ──────────────────────────────────────────────────
  - bioconductor-deseq2
  - bioconductor-edger
  - bioconductor-limma
  - bioconductor-sva               # Batch correction (Part 3)
  - bioconductor-biobase
  # ── Annotation & gene IDs ────────────────────────────────────────────────────
  - bioconductor-biomart
  - bioconductor-annotationdbi
  - bioconductor-org.hs.eg.db
  - bioconductor-org.mm.eg.db
  - bioconductor-org.rn.eg.db
  # ── Pathway enrichment ───────────────────────────────────────────────────────
  - bioconductor-clusterprofiler
  - bioconductor-pathview
  - bioconductor-enrichplot
  - bioconductor-dose
  # ── Visualization ────────────────────────────────────────────────────────────
  - bioconductor-enhancedvolcano
  - r-ggplot2
  - r-ggrepel
  - r-ggfortify
  - r-pheatmap
  - r-venndiagram
  - r-corrplot
  - r-hmisc
  # ── Data handling ────────────────────────────────────────────────────────────
  - r-data.table
  - r-readxl
  - r-stringr
  - r-tidyverse
  - r-dplyr
  # ── Isoform / normalization (Parts 10, 19) ────────────────────────────────────
  - bioconductor-tximport
  - bioconductor-rtracklayer
  # ── Utilities ────────────────────────────────────────────────────────────────
  - r-devtools
  - r-biocmanager
  # ── CRAN-only (not in bioconda) — installed by r_scripts/install_core_r_extras.R
  # - ggprism       (publication-style ggplot2 themes, Part 4)
