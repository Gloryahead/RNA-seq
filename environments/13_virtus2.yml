name: virtus2_env
# Tutorial: Part 17 (viral sequence detection with VIRTUS2)
# VIRTUS2 uses CWL workflows; Singularity is required to pull its containerized tools.
# Activate: micromamba activate virtus2_env
# Post-activation setup:
#   git clone https://github.com/yyoshiaki/VIRTUS2.git
# Reference genome: GRCh38.p13, Gencode release 33
# Virus reference: provided in the VIRTUS2 repository
# Example input: paired-end RNA-seq FASTQ (.fastq.gz)
# NOTE: singularity is not in conda — load the UA HPC system module instead:
#   module load singularity   (or: module load apptainer)
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - cwltool>=3.1
  - numpy>=1.24
  - pandas>=1.5
  - scipy>=1.10
  - statsmodels>=0.14
  - seaborn>=0.13
